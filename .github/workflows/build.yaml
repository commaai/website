name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Check every car on /vehicles has a harness
        run: bun scripts/check-harnesses.js

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Cache imagetools directory
        uses: actions/cache@v4
        with:
          path: ./node_modules/.cache/imagetools
          key: imagetools-${{ runner.os }}-${{ hashFiles('bun.lockb', 'vite.config.js') }}-${{ hashFiles('src/**/*.png', 'src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.gif') }}
          restore-keys: |
            imagetools-${{ runner.os }}-${{ hashFiles('bun.lockb', 'vite.config.js') }}-

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        name: Build (production)
        run: bun run build
        env:
          VITE_SHOPIFY_STOREFRONT_API_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_API_TOKEN }}

      - if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        name: Build (development)
        run: bun run build

      - name: Upload built project
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          path: ./build
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
          name: build-artifacts-${{ github.run_id }}

      # TODO: remove when https://github.com/firebase/firebase-tools/issues/10730 is fixed
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'commaai/website'
        with:
          node-version: '24.18.0'

      - name: Cache Firebase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'commaai/website'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: firebase-cli-${{ runner.os }}-node24-15.32.1

      - name: Deploy to prod
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'commaai/website'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMMA_WEB }}
          channelId: live
          firebaseToolsVersion: 15.32.1
          projectId: comma-web
