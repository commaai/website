name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # 15.34.1+ checks the Hosting API via Service Usage
  FIREBASE_TOOLS_VERSION: 15.34.0

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Check every car on /vehicles has a harness
        run: bun scripts/check-harnesses.js

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Cache imagetools directory
        uses: actions/cache@v4
        with:
          path: ./node_modules/.cache/imagetools
          # the patch changes imagetools' cache ids, so a new patch needs a fresh cache
          key: imagetools-${{ hashFiles('patches/vite-imagetools*') }}-${{ hashFiles('**/*.png', '**/*.jpg', '**/*.jpeg', '**/*.gif') }}
          restore-keys: |
            imagetools-${{ hashFiles('patches/vite-imagetools*') }}-

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        name: Build (production)
        run: bun run build
        env:
          VITE_SHOPIFY_STOREFRONT_API_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_API_TOKEN }}

      - if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        name: Build (development)
        run: bun run build

      - name: Check titles, descriptions, canonicals, share tags, JSON-LD and the sitemap
        run: bun scripts/check-seo.js

      - name: Upload built project
        uses: actions/upload-artifact@v4
        with:
          path: ./build
          overwrite: true
          retention-days: 1
          name: build-artifacts-${{ github.run_id }}

      # TODO: remove when https://github.com/firebase/firebase-tools/issues/10730 is fixed
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Cache firebase-tools
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'commaai/website'
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: firebase-tools-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Deploy to prod
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'commaai/website'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMMA_WEB }}
          channelId: live
          projectId: comma-web
          firebaseToolsVersion: ${{ env.FIREBASE_TOOLS_VERSION }}

  links:
    name: Check links (warning only)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # broken links are reported in the job summary but never block the merge or the preview
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download built project
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: ./build

      # internal links are checked offline against build/; see lychee.toml
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --preprocess scripts/lychee-preprocess.sh
            --no-progress
            --root-dir '${{ github.workspace }}/build'
            --remap '^https://comma\.ai(/[^?#]*)?([?#].*)?$ file://${{ github.workspace }}/build$1'
            'build/**/*.html'
          fail: false
          failIfEmpty: false
          jobSummary: true
