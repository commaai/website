name: Preview

on:
  workflow_run:
    workflows: ["Build"]
    types: ["completed"]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TARGET_REPO: ${{ github.repository }}
          PR_BRANCH: |-
            ${{
              (github.event.workflow_run.head_repository.owner.login != github.event.workflow_run.repository.owner.login)
                && format('{0}:{1}', github.event.workflow_run.head_repository.owner.login, github.event.workflow_run.head_branch)
                || github.event.workflow_run.head_branch
            }}
        run: |
          gh pr view --repo "${PR_TARGET_REPO}" "${PR_BRANCH}" \
            --json 'number' \
            --jq '"number=\(.number)"' \
            >> "$GITHUB_OUTPUT"

      - name: Create PR check
        uses: actions/github-script@v7
        id: check
        with:
          script: |
            const response = await github.rest.checks.create({
              name: 'preview',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress',
              output: {
                title: 'Preview deployment',
                summary: 'In Progress',
              },
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            return response.data.id

      # Only trusted deployment configuration is needed; never execute PR code here.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            firebase.json
            .firebaserc
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.event.workflow_run.id }}
          path: ./build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # TODO: remove when https://github.com/firebase/firebase-tools/issues/10730 is fixed
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Cache Firebase CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: firebase-cli-${{ runner.os }}-node24-15.32.1

      - name: Deploy preview
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMMA_WEB }}
          projectId: comma-web
          channelId: pr${{ steps.pr.outputs.number }}
          expires: 5d
          firebaseToolsVersion: 15.32.1

      - name: Comment URL on PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            <!-- _(run_id **${{ github.run_id }}**)_ -->

            # deployed preview: ${{ steps.deploy.outputs.details_url }}

            Welcome! Make sure to:
            * read the contributing guidelines
            * mark your PR as a draft until it's ready to review
            * post the preview on [Discord](https://discord.comma.ai); feedback from users will speedup the PR review
          comment-tag: run_id
          pr-number: ${{ steps.pr.outputs.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PR check
        if: always() && steps.check.outputs.result != ''
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ steps.check.outputs.result }}
          CONCLUSION: ${{ job.status }}
        with:
          script: |
            await github.rest.checks.update({
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion: process.env.CONCLUSION,
              output: {
                title: 'Preview deployment',
                summary: `Result: ${process.env.CONCLUSION}`,
              },
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
