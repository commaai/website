name: Preview

on:
  workflow_run:
    workflows: ["Build"]
    types: ["completed"]

env:
  # 15.34.1+ checks the Hosting API via Service Usage
  FIREBASE_TOOLS_VERSION: 15.34.0

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pr:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    name: Find PR number
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      # use `gr pr view` to get the PR number
      # https://github.com/orgs/community/discussions/25220#discussioncomment-11285971
      - name: Find PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TARGET_REPO: ${{ github.repository }}
          PR_BRANCH: |-
            ${{
              (github.event.workflow_run.head_repository.owner.login != github.event.workflow_run.repository.owner.login)
                && format('{0}:{1}', github.event.workflow_run.head_repository.owner.login, github.event.workflow_run.head_branch)
                || github.event.workflow_run.head_branch
            }}
        run: |
          gh pr view --repo "${PR_TARGET_REPO}" "${PR_BRANCH}" \
            --json 'number' \
            --jq '"number=\(.number)"' \
            >> $GITHUB_OUTPUT

      - run: |
          echo "PR number: ${{ steps.pr.outputs.number }}"

  preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    name: Deploy preview
    needs: pr
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      check_id: ${{ steps.check.outputs.result }}
      url: ${{ steps.deploy.outputs.details_url }}
    steps:
      - name: Create PR check
        uses: actions/github-script@v7
        id: check
        with:
          script: |
            const response = await github.rest.checks.create({
              name: 'preview',
              head_sha: '${{ github.event.workflow_run.head_sha }}',
              status: 'in_progress',
              output: {
                title: 'Preview deployment',
                summary: 'In Progress',
              },
              owner: 'commaai',
              repo: '${{ github.event.repository.name }}',
            })
            return response.data.id

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.event.workflow_run.id }}
          path: ./build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # TODO: remove when https://github.com/firebase/firebase-tools/issues/10730 is fixed
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Cache firebase-tools
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: firebase-tools-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Deploy preview
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMMA_WEB }}
          projectId: comma-web
          firebaseToolsVersion: ${{ env.FIREBASE_TOOLS_VERSION }}
          channelId: pr${{ needs.pr.outputs.number }}
          expires: 5d

      - name: Comment URL on PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            <!-- _(run_id **${{ github.run_id }}**)_ -->

            # deployed preview: ${{ steps.deploy.outputs.details_url }}

            Welcome! Make sure to:
            * read the contributing guidelines
            * mark your PR as a draft until it's ready to review
            * post the preview on [Discord](https://discord.comma.ai); feedback from users will speedup the PR review
          comment-tag: run_id
          pr-number: ${{ needs.pr.outputs.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    name: Lighthouse (warning only)
    needs: [pr, preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # scores are posted for information; they never fail the workflow
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: List preview URLs
        id: urls
        env:
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
        run: |
          base="${PREVIEW_URL%/}"
          {
            echo 'urls<<EOF'
            for path in / /shop/comma-four /vehicles /setup; do echo "${base}${path}"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.urls }}
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true

      - name: Summarize scores
        id: summary
        if: always() && steps.lighthouse.outputs.resultsPath
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ steps.lighthouse.outputs.resultsPath }}
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const read = (file, fallback) => {
              const path = `${process.env.RESULTS}/${file}`;
              return fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : fallback;
            };
            const manifest = read('manifest.json', []);
            const links = read('links.json', {});
            if (!manifest.length) return '';
            const base = process.env.PREVIEW_URL.replace(/\/$/, '');
            const score = value => (typeof value === 'number' ? Math.round(value * 100) : '–');
            const rows = manifest
              .filter(run => run.isRepresentativeRun)
              .map(({ url, summary }) => {
                const path = url.startsWith(base) ? url.slice(base.length) || '/' : url;
                const report = links[url] ? `[report](${links[url]})` : '';
                return `| \`${path}\` | ${score(summary.performance)} | ${score(summary.accessibility)} | ${score(summary['best-practices'])} | ${score(summary.seo)} | ${report} |`;
              });
            return [
              '### lighthouse (mobile, preview)',
              '',
              '| page | performance | accessibility | best practices | seo | |',
              '| --- | --- | --- | --- | --- | --- |',
              ...rows,
              '',
              'Warnings only; reports expire after a few days.',
            ].join('\n');

      - name: Comment scores on PR
        if: always() && steps.summary.outputs.result
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: ${{ steps.summary.outputs.result }}
          comment-tag: lighthouse
          pr-number: ${{ needs.pr.outputs.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  update_pr_check:
    if: always() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    name: Update PR Check
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Update PR check
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.checks.update({
              check_run_id: ${{ needs.preview.outputs.check_id }},
              name: 'preview',
              head_sha: '${{ github.event.workflow_run.head_sha }}',
              status: 'completed',
              conclusion: '${{ needs.preview.result }}',
              output: {
                title: 'Preview deployment',
                summary: 'Result: ${{ needs.preview.result }}',
              },
              owner: 'commaai',
              repo: '${{ github.event.repository.name }}',
            })
